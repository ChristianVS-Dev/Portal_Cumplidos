# Desarrollo: front con Vite + hot reload (sin rebuild por cada cambio).
# Uso: npm run docker:dev
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
      VITE_PORTAL_API_KEY: ${PORTAL_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
    # !override evita fusionar con "8080:80" del compose base (doble bind = web no arranca)
    ports: !override
      - "${WEB_HOST_PORT:-19080}:5173"
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173" ]

volumes:
  web_node_modules:
